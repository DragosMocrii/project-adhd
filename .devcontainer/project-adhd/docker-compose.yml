name: "${COMPOSE_INSTANCE}"

services:
  workspace:
    build:
      context: ./image
    env_file: devcontainer.env
    command: sleep infinity
    environment:
      PULSE_SERVER: unix:/run/host/pulse/native
    volumes:
      # Host PulseAudio (or pipewire-pulse) for Herdr sound notifications.
      # initialize.sh sets HOST_PULSE_DIR in .env only on a Linux host with a
      # socket at $XDG_RUNTIME_DIR/pulse/native. Otherwise (macOS, no audio
      # server) this binds the runtime folder, which the workspace mount
      # already exposes and which has no `native` socket: creation succeeds,
      # sound is silently unavailable, and Docker never creates a host path.
      # The directory is bound rather than the socket so a restarted audio
      # server's new socket is still visible.
      - type: bind
        source: ${HOST_PULSE_DIR:-.}
        target: /run/host/pulse
        bind:
          create_host_path: false
      - claude-state:/home/vscode/.claude
      - github-state:/home/vscode/.config/gh
      - rtk-config-state:/home/vscode/.config/rtk
      - rtk-data-state:/home/vscode/.local/share/rtk
      - codex-state:/home/vscode/.codex
      - gemini-state:/home/vscode/.gemini
      - omp-state:/home/vscode/.omp
      - lock-state:/home/vscode/.local/state/project-adhd
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      - vscode-machine:/home/vscode/.vscode-server/data/Machine
      - vscode-user:/home/vscode/.vscode-server/data/User
      - ../..:/workspaces/${WORKSPACE_NAME}:cached

volumes:
  claude-state:
    name: "${AGENT_STATE_PREFIX}-claude"
  github-state:
    name: "${AGENT_STATE_PREFIX}-gh"
  rtk-config-state:
    name: "${AGENT_STATE_PREFIX}-rtk-config"
  rtk-data-state:
    name: "${PROJECT_STATE_PREFIX}-rtk-data"
  codex-state:
    name: "${AGENT_STATE_PREFIX}-codex"
  gemini-state:
    name: "${AGENT_STATE_PREFIX}-gemini"
  omp-state:
    name: "${AGENT_STATE_PREFIX}-omp"
  lock-state:
    name: "${AGENT_STATE_PREFIX}-lock"
  # VS Code state follows the project, not the worktree: linked worktrees share
  # PROJECT_STATE_PREFIX, so switching worktrees keeps installed extensions.
  vscode-extensions:
    name: "${PROJECT_STATE_PREFIX}-vscode-extensions"
  vscode-machine:
    name: "${PROJECT_STATE_PREFIX}-vscode-machine"
  vscode-user:
    name: "${PROJECT_STATE_PREFIX}-vscode-user"
