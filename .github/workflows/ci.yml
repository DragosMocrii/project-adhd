name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install scaffold dependencies
        run: bun install --frozen-lockfile
      - name: Run contract suite
        run: bun test
      - name: Typecheck
        run: bun run typecheck

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          shellcheck \
            .devcontainer/project-adhd/initialize.sh \
            .devcontainer/project-adhd/post-create.sh \
            .devcontainer/project-adhd/verify.sh \
            .devcontainer/project-adhd/lib/agent-tools.sh
